<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Guiado - Atividade MATRIZ</title>
    <link rel="stylesheet" href="css_atividade.css">
</head>
<body>
    <header class="cabecalho">
        <h1>Atividade JavaScript MATRIZ</h1>
    </header>

    <main class="conteudo">
        <h2>Matriz 3x3 Aleatória</h2>
        <p>Crie um algoritmo que gere uma MATRIZ 3x3 preenchida com números aleatórios entre 1 e 9. Ao clicar no botão "Gerar Matriz", percorra a matriz somando todos os seus elementos e exiba o resultado total.</p>

        <form>
            <br>
            <textarea name="fonte" cols="80" rows="40">
&lt;!DOCTYPE html&gt;
&lt;html lang="pt-BR"&gt;
&lt;head&gt;
    &lt;meta charset="UTF-8"&gt;
    &lt;title&gt;Estrutura MATRIZ JavaScript - Atividade exemplo&lt;/title&gt;
    &lt;style&gt;
        section{
            margin-top: 0px auto;
        }

        .cadmatriz{
            width: 300px;
            margin: 0px auto;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .cadmatriz button{
            width: 60%;
            margin: 0 20%;
            background-color: #b1ccf5;
            font-weight: bold;
            font-size: 16px;
        }

        h2{
            text-align: center;
            margin-top: 0px;
            margin-bottom: 10px;
            font-size: 50px;
        }
    &lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;

    &lt;section&gt;
        &lt;h2&gt;Estrutura MATRIZ (Array bidimensional - Atividade exemplo)&lt;/h2&gt;

        &lt;form name="frmmatriz" action="#" method="get" onsubmit="return gerarMatriz()"&gt;
            &lt;fieldset class="cadmatriz"&gt;
                &lt;legend&gt;Gerar matriz&lt;/legend&gt;
                &lt;br&gt;
                &lt;button type="submit"&gt;Gerar Matriz&lt;/button&gt;
            &lt;/fieldset&gt;
        &lt;/form&gt;

    &lt;/section&gt;

    &lt;script type="text/javascript"&gt;

        function gerarMatriz(){

            let matriz = [];
            let texto = "";
            let soma = 0;

            for(let i = 0; i &lt; 3; i++){
                matriz[i] = [];
                for(let j = 0; j &lt; 3; j++){
                    let valor = Math.floor(Math.random() * 9) + 1;
                    matriz[i][j] = valor;
                    soma += valor;
                    texto += valor + "  ";
                }
                texto += "\n";
            }

            alert("Matriz gerada:\n\n" + texto + "\nSoma total: " + soma);
            return false;
        }

    &lt;/script&gt;

&lt;/body&gt;
&lt;/html&gt;
            </textarea>
            <br><br>
            <input type="button" value="Testar sua página" onclick="document.write(fonte.value);">
        </form>

        <br><br>
        <a href="atividades.html">Voltar</a>
    </main>
    
</body>
</html>
